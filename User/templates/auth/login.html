{% extends 'layouts/app.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-sm-6">
        <h2 class="text-muted">Login</h2>

        <!-- Add this block to display login errors -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger" role="alert" id="login-error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label}}">Username : </label>
                <input type="text" name="{{form.username.name}}" class="form-control" value="{{ form.username.value}}"/>
                <span class="text-danger"> {{form.username.errors}} </span>    
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label}}">Password : </label>
                <input type="password" name="{{form.password.name}}" class="form-control" value="{{ form.password.value}}"/>
                <span class="text-danger"> {{form.password.errors}} </span>    
            </div>

            <button type="submit" class="btn btn-dark">Login</button>
            <a href="{% url 'register' %}" class="btn btn-default">Create new account</a>
        </form>

        <!-- Place the script here, inside the content block -->
        <script>
            // Auto-hide alert after 4 seconds
            setTimeout(function () {
                const alertBox = document.getElementById('login-error');
                if (alertBox) {
                    alertBox.style.transition = 'opacity 0.5s ease';
                    alertBox.style.opacity = '0';
                    setTimeout(() => alertBox.style.display = 'none', 500);
                }
            }, 4000);
        </script>
    </div>
</div>

{% endblock %}
